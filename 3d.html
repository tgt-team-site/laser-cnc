<style>

<section class="hero"><div id="ld"><div class="dot"></div><span>Loading the machine</span></div>
<canvas id="c" aria-label="Interactive 3D model of the laser CNC machine. Drag to rotate, scroll to zoom."></canvas>
<div class="title"><h1>Laser<br>CNC</h1><p>A rigid cutting and engraving machine, grown out of a wooden pen plotter.</p><a class="back" href="index.html">Back to the project</a></div>
<div class="panel side">
<div class="parts" role="group" aria-label="Focus on a part">
<button data-p="all" aria-pressed="true">Whole machine</button><button data-p="motor" aria-pressed="false">Motors</button><button data-p="screw" aria-pressed="false">Lead screws</button><button data-p="laser" aria-pressed="false">Laser head</button><button data-p="bed" aria-pressed="false">Work bed</button></div>
<p id="info"></p>
<label for="ex">Exploded view <span id="exv">0%</span></label><input id="ex" type="range" min="0" max="100" value="0">
<label for="pw">Laser power <span id="pwv">60%</span></label><input id="pw" type="range" min="5" max="100" value="60">
<label for="sp">Engraving speed <span id="spv">60</span></label><input id="sp" type="range" min="20" max="200" value="60">
<form class="row" id="f"><input id="tx" value="TG TEAM" maxlength="14" aria-label="Text to engrave"><button class="go" type="submit">Engrave</button></form>
</div>
<div class="panel gcode"><b>Live G-code · Arduino + GRBL</b><pre id="gl"></pre></div>
<div class="hint">Drag to orbit · scroll to zoom</div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

for(let i=0;i<5;i++)box(.04,.5,.4,alu,-.14+i*.07,.82,0,car);
const BEAM=new T.Mesh(new T.CylinderGeometry(.018,.018,.26,6),new T.MeshBasicMaterial({color:0xff6a4a}));BEAM.position.y=.25;car.add(BEAM);
const glow=new T.Mesh(new T.SphereGeometry(.07,12,12),new T.MeshBasicMaterial({color:0xffb199,transparent:true,opacity:.9,blending:T.AdditiveBlending}));glow.position.y=.14;car.add(glow);
const grid=new T.GridHelper(40,40,0x2a4170,0x182a4d);grid.position.y=-.32;S.add(grid);
// wood texture
const W=document.createElement('canvas');W.width=680;W.height=440;const X=W.getContext('2d');
function wood(){X.fillStyle='#c99a63';X.fillRect(0,0,680,440);for(let i=0;i<70;i++){X.strokeStyle='rgba(120,70,30,'+(.06+Math.random()*.14)+')';X.lineWidth=1+Math.random()*2;X.beginPath();const y=Math.random()*440;X.moveTo(0,y);for(let x=0;x<=680;x+=40)X.lineTo(x,y+Math.sin(x*.02+i)*4);X.stroke()}}
wood();const tex=new T.CanvasTexture(W);tex.anisotropy=4;
const plank=new T.Mesh(new T.PlaneGeometry(3.4,2.2),new T.MeshStandardMaterial({map:tex,roughness:.8}));plank.rotation.x=-Math.PI/2;plank.position.y=.125;bed.add(plank);
const dn=500,dp=new Float32Array(dn*3);for(let i=0;i<dn*3;i++)dp[i]=(Math.random()-.5)*(i%3==1?10:26);
const dg=new T.BufferGeometry();dg.setAttribute('position',new T.BufferAttribute(dp,3));const dust=new T.Points(dg,new T.PointsMaterial({color:0x7fb2ff,size:.04,transparent:true,opacity:.5,depthWrite:false}));dust.position.y=3;S.add(dust);
// sparks
const N=40,sp=new Float32Array(N*3),sv=new Float32Array(N*3),sl=new Float32Array(N);
const spg=new T.BufferGeometry();spg.setAttribute('position',new T.BufferAttribute(sp,3));
const sparks=new T.Points(spg,new T.PointsMaterial({color:0xffc48a,size:.05,transparent:true,blending:T.AdditiveBlending,depthWrite:false}));sparks.frustumCulled=false;S.add(sparks);
// engraving
const C=200,H=100;let mask,rows,ri,cc,dir,state='idle',wait=0;
function start(txt){const o=document.createElement('canvas');o.width=C;o.height=H;const q=o.getContext('2d');let f=80;q.textAlign='center';q.textBaseline='middle';
do{q.font='800 '+f+'px Bricolage Grotesque, Arial Black, sans-serif';f-=3}while(q.measureText(txt).width>C-10&&f>8);
q.fillText(txt.toUpperCase(),C/2,H/2+3);const d=q.getImageData(0,0,C,H).data;mask=new Uint8Array(C*H);rows=[];
for(let r=0;r<H;r++){let a=-1,b=-1;for(let c=0;c<C;c++)if(d[(r*C+c)*4+3]>128){mask[r*C+c]=1;if(a<0)a=c;b=c}if(a>=0)rows.push({r,a,b})}
wood();tex.needsUpdate=true;ri=0;dir=1;cc=rows.length?rows[0].a:0;state=rows.length?'run':'idle'}
const head={x:0,z:0},pw=$('pw'),spd=$('sp');let burning=false,lastBurn=0,lg=[],lgT=0;
function step(dt){burning=false;if(state=='done'){wait-=dt;return}if(state!='run')return;
const row=rows[ri],tx=-1.5+.015*cc+.0075,tz=-.75+.015*row.r,k=1-Math.exp(-dt*9);
const dx=tx-head.x,dz=tz-head.z;head.x+=dx*k;head.z+=dz*k;
if(Math.hypot(dx,dz)<.04){const prev=cc;cc+=dir*(+spd.value)*dt;const lo=Math.min(prev,cc),hi=Math.max(prev,cc);
for(let c=Math.max(row.a,Math.floor(lo));c<=Math.min(row.b,Math.ceil(hi));c++)if(mask[row.r*C+c]){X.fillStyle='rgba(42,20,8,'+(.55+pw.value/250)+')';X.fillRect(40+c*3,70+row.r*3,3,3);burning=true}
tex.needsUpdate=true;
if(cc>row.b+1&&dir>0||cc<row.a-1&&dir<0){ri++;dir=-dir;if(ri>=rows.length){state='done';wait=3}else cc=dir>0?rows[ri].a:rows[ri].b}}}
// camera
const cs={th:2.9,ph:.45,r:22,t:new T.Vector3(0,.3,0)},g={th:.7,ph:1.0,r:10,t:new T.Vector3(0,.3,0)};let focus='all',drag=false,lx,ly,idle=0;
const views={all:{r:10,ph:1.0,t:[0,.3,0]},motor:{r:4.2,ph:1.15,t:[-2.45,.4,-2.6]},screw:{r:5.5,ph:.95,t:[2.45,.5,0]},laser:{r:3.2,ph:1.15,t:null},bed:{r:5,ph:.55,t:[0,.1,0]}};
const txt={all:'Aluminum frame, two lead-screw axes and a moving gantry. Drag to orbit, or pick a part.',motor:'Stepper motors drive each axis. They replaced the weak 28BYJ-48 motors of the plotter, giving real torque and finer steps.',screw:'Lead screws turn motor rotation into straight travel, which cuts the backlash and missed steps the belt-driven plotter suffered.',laser:'The laser module rides the carriage. A focused beam cuts, etches or engraves wood, acrylic, leather and soft metals.',bed:'The work bed holds the material. Type a word and press Engrave to watch the raster pass burn it in.'};
function setP(p){focus=p;document.querySelectorAll('.parts button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p==p));$('info').textContent=txt[p];const v=views[p];g.r=v.r;g.ph=v.ph;if(v.t)g.t.set(...v.t)}
document.querySelectorAll('.parts button').forEach(b=>b.onclick=()=>setP(b.dataset.p));setP('all');
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('pointermove',e=>{if(!drag)return;g.th-=(e.clientX-lx)*.007;g.ph=Math.min(1.5,Math.max(.25,g.ph-(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;idle=0});
cv.addEventListener('wheel',e=>{e.preventDefault();g.r=Math.min(16,Math.max(2.5,g.r*(1+e.deltaY*.001)))},{passive:false});
const ex=$('ex');let exv=0;ex.oninput=()=>$('exv').textContent=ex.value+'%';
pw.oninput=()=>$('pwv').textContent=pw.value+'%';spd.oninput=()=>$('spv').textContent=spd.value;
$('f').onsubmit=e=>{e.preventDefault();const v=$('tx').value.trim();if(v){start(v);setP('bed')}};
function size(){const r=cv.getBoundingClientRect();R.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix();cam.fov=r.width<r.height?60:38;}
addEventListener('resize',size);size();start('TG TEAM');
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;let last=performance.now(),px=0,pz=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
if(state=='done'&&wait<=0&&!drag)start($('tx').value.trim()||'TG TEAM');
step(dt);
exv+=(ex.value/100-exv)*(1-Math.exp(-dt*5));
gantry.position.set(0,exv*1.8,0);gantry.position.z=head.z;car.position.x=head.x;
screws.position.y=exv*.8;bed.position.y=-exv*.7;frame.position.y=0;
const on=burning&&exv<.05;BEAM.visible=glow.visible=on;
if(on){BEAM.scale.x=BEAM.scale.z=.8+Math.random()*.6;hot.intensity=.6+pw.value/60;hot.position.set(head.x,.45,head.z)}else hot.intensity*=.8;
sz.forEach(s=>s.rotation.y+=(head.z-pz)*9);sx.rotation.x+=(head.x-px)*9;px=head.x;pz=head.z;
// sparks
for(let i=0;i<N;i++){if(sl[i]<=0){if(on&&Math.random()<.35){sl[i]=.5+Math.random()*.4;sp[i*3]=head.x;sp[i*3+1]=.14;sp[i*3+2]=head.z;sv[i*3]=(Math.random()-.5)*1.2;sv[i*3+1]=1+Math.random()*1.5;sv[i*3+2]=(Math.random()-.5)*1.2}else{sp[i*3+1]=-9;continue}}
sl[i]-=dt;sv[i*3+1]-=4*dt;for(let j=0;j<3;j++)sp[i*3+j]+=sv[i*3+j]*dt;if(sp[i*3+1]<.13){sl[i]=0}}
spg.attributes.position.needsUpdate=true;
// G-code readout
lgT+=dt;if(lgT>.15){lgT=0;const mx=((head.x+1.5)/3*100).toFixed(1),my=((head.z+.75)/1.5*50).toFixed(1);
lg.push((on?'G1':'G0')+' X'+mx+' Y'+my+(on?' S'+Math.round(pw.value*10):''));if(lg.length>6)lg.shift();$('gl').textContent=lg.join('\n')}
// camera
if(!drag&&!rm){idle+=dt;if(idle>4&&focus=='all')g.th+=dt*.08}
if(focus=='laser')g.t.set(head.x,.5,head.z);
const k=1-Math.exp(-dt*Math.min(4,1+now/1400));cs.th+=(g.th-cs.th)*k;cs.ph+=(g.ph-cs.ph)*k;cs.r+=(g.r-cs.r)*k;cs.t.lerp(g.t,k);
cam.position.set(cs.t.x+cs.r*Math.sin(cs.ph)*Math.sin(cs.th),cs.t.y+cs.r*Math.cos(cs.ph),cs.t.z+cs.r*Math.sin(cs.ph)*Math.cos(cs.th));cam.lookAt(cs.t);
dust.rotation.y+=dt*.03;R.render(S,cam);if(!ready){ready=1;$('ld').classList.add('off')}}
requestAnimationFrame(loop);
}catch(e){console.error(e);const h=document.querySelector('.hero');h.classList.add('nogl');document.getElementById('ld').remove()}})();
</script>
</body></html>
